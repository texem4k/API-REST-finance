
        <header class="headerClass">
            <div></div>
        </header>

        <main>


            @if(currentUser){
              <h2 class="title">Bienvenido, {{currentUser.name}}</h2>
            }
            @else{
              <h2 class="title">Bienvenido, registrate o inicia sesión para realizar operaciones</h2>

            }


          <div class="buttons">
                <button (click)="goToLogin()">Registrarse</button>
                <button>Iniciar sesión</button>
          </div>


            <div class="sections">
                <section class="usersSection">

                    <h3>Todos los usuarios registrados:</h3>
                    <p></p>
                    <table class="users"></table>

                </section>

                <section class="transactionSection">

                    <h3>Todas tus transacciones:</h3>
                    <p></p>
                    <table class="transactions"></table>
                </section>
            </div>

        </main>
