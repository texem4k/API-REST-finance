<body>

  <div class="title">
    <h2>Registro</h2>
  </div>

  <div class="registerForm">
    <form [formGroup]="registerForm" (ngSubmit)="register()">

      <p>Nombre de usuario</p>
      <input
        type="text"
        name="username"
        [formControl]="registerForm.controls['username']"
        placeholder="John Doe"
      >

      @if(registerForm.controls.username.invalid && registerForm.controls.username.touched){
        <p class="messageError"></p>
      }

      <p>Correo electrónico</p>
      <input
        type="email"
        name="email"
        [formControl]="registerForm.controls['email']"
        placeholder="example@example.com"
      >

      <p>Contraseña</p>
      <input
        type="password"
        name="password"
        [formControl]="registerForm.controls['password']"
      >
      <br><br>
      <button class="actionButton" type="submit"> Registarse
      </button>
    </form>
  </div>

</body>
