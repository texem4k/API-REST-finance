<body>

<div class="title">
  <h2>Inicio de sesión</h2>
</div>

<div class="loginForm">
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <p>Correo electrónico</p>
    <input
      type="email"
      name="email"
      [formControl]="loginForm.controls['email']"
      placeholder="example@example.com"
    >

    <p>Contraseña</p>
    <input
      type="password"
      name="password"
      [formControl]="loginForm.controls['password']"
    >
    <br><br>
    <button class="actionButton" type="submit"> Iniciar sesión
    </button>
  </form>

  <button (click)="resetPassword=true">Contraseña olvidada</button>

  @if(resetPassword){
    <form [formGroup]="recoverPasswordForm" (ngSubmit)="changePassword()">
      <p>Correo electrónico</p>
      <input
        type="password"
        name="newPasssword"
        [formControl]="recoverPasswordForm.controls[newPassword1]"
        placeholder="example@example.com"
      >
    </form>
  }

</div>

</body>
