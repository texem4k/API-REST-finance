<body>

<div class="title">
  <h2>Inicio de sesión</h2>
</div>

<div class="loginForm">
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <p>Correo electrónico</p>
    <input
      type="email"
      [formControl]="loginForm.controls['email']"
      placeholder="example@example.com"
    >

    <p>Contraseña</p>
    <input
      type="password"
      [formControl]="loginForm.controls['password']"
    >
    <br><br>
    <button class="actionButton" type="submit"> Iniciar sesión
    </button>
  </form>

  <button (click)="resetPassword=true">Contraseña olvidada</button>

  @if(resetPassword){
    <form [formGroup]="recoverPasswordForm" (ngSubmit)="changePassword()">
      <p>Correo electrónico</p>
      <input
        type="email"
        [formControl]="recoverPasswordForm.controls['email']"
        placeholder="example@example.com"
      >

      <p>Nueva contraseña (Debe tener al menos 8 carácteres, un dígito y un carácter especial, y una mayúscula</p>
      <input
        type="password"
        [formControl]="recoverPasswordForm.controls['newPassword']"
      >

      <p>Confirmar contraseña</p>
      <input
        type="password"
        [formControl]="recoverPasswordForm.controls['newPassword1']"
      >

      <button class="actionButton" type="submit"> Cambiar contraseña
      </button>
    </form>
  }

</div>

</body>
